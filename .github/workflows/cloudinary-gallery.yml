name: Update Cloudinary Gallery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate gallery.json from Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          node <<'EOF'
          const crypto = require("crypto");
          const fs = require("fs");

          const cloudName = process.env.CLOUDINARY_CLOUD_NAME;
          const apiKey = process.env.CLOUDINARY_API_KEY;
          const apiSecret = process.env.CLOUDINARY_API_SECRET;

          const timestamp = Math.floor(Date.now() / 1000);

          const stringToSign =
            `asset_folder=test&max_results=500&timestamp=${timestamp}${apiSecret}`;

          const signature = crypto
            .createHash("sha1")
            .update(stringToSign)
            .digest("hex");

          const body = new URLSearchParams({
            asset_folder: "test",
            max_results: "500",
            timestamp: String(timestamp),
            api_key: apiKey,
            signature: signature
          });

          fetch(
            `https://api.cloudinary.com/v1_1/${cloudName}/resources/search`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded"
              },
              body: body.toString()
            }
          )
          .then(async (response) => {
            const text = await response.text();

            if (!response.ok) {
              throw new Error(text);
            }

            const data = JSON.parse(text);

            const images = (data.resources || []).map((image) => ({
              public_id: image.public_id,
              url: image.secure_url,
              width: image.width,
              height: image.height
            }));

            fs.mkdirSync("data", { recursive: true });

            fs.writeFileSync(
              "data/gallery.json",
              JSON.stringify(images, null, 2)
            );

            console.log(`Found ${images.length} images.`);
          })
          .catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

      - name: Commit gallery.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gallery.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Cloudinary gallery [skip ci]"
            git push
          fi
