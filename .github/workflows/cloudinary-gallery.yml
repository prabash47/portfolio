name: Update Cloudinary Gallery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-gallery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Cloudinary images
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          node <<'EOF'
          const crypto = require("crypto");
          const fs = require("fs");

          const cloudName = process.env.CLOUDINARY_CLOUD_NAME;
          const apiKey = process.env.CLOUDINARY_API_KEY;
          const apiSecret = process.env.CLOUDINARY_API_SECRET;

          const timestamp = Math.floor(Date.now() / 1000);

          const paramsToSign = `expression=asset_folder:test&timestamp=${timestamp}${apiSecret}`;
          const signature = crypto
            .createHash("sha1")
            .update(paramsToSign)
            .digest("hex");

          const body = new URLSearchParams({
            expression: "asset_folder:test",
            max_results: "500",
            timestamp: timestamp.toString(),
            api_key: apiKey,
            signature: signature
          });

          fetch(`https://api.cloudinary.com/v1_1/${cloudName}/resources/search`, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded"
            },
            body
          })
          .then(async res => {
            if (!res.ok) {
              throw new Error(await res.text());
            }

            const data = await res.json();

            const images = (data.resources || []).map(item => ({
              public_id: item.public_id,
              url: item.secure_url,
              width: item.width,
              height: item.height
            }));

            fs.mkdirSync("data", { recursive: true });

            fs.writeFileSync(
              "data/gallery.json",
              JSON.stringify(images, null, 2)
            );

            console.log(`Found ${images.length} images`);
          })
          .catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Commit gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/gallery.json

          git diff --cached --quiet || git commit -m "Update Cloudinary gallery"

          git push
